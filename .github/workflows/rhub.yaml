# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}
    # dti (a Suggests) is intentionally not installed on rhub (we install only
    # hard deps below), so tell R CMD check not to fail on its absence.
    # RHUB_ACTIONS_DEPS_DEPENDENCIES selects the "hard" dependency set in
    # r-hub/actions/setup-deps@v1. We use the env var rather than the
    # `dependencies` input because the input is templated into `inp <- "..."`,
    # and passing the quoted R expression "hard" through that wrapping is
    # fragile; the env var branch is passed straight through and evaluated as R
    # by r-lib/actions/setup-r-dependencies.
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      RHUB_ACTIONS_DEPS_DEPENDENCIES: '"hard"'

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Install Quarto from its self-contained tarball instead of using
      # quarto-dev/quarto-actions/setup. The generic rhub check-containers are
      # heterogeneous: some lack `wget` (so that action fails at its download
      # step with "wget: command not found", exit 127) and others lack
      # `apt`/`sudo` (its install step then fails with "apt: command not
      # found", exit 1). Fetching and extracting the tarball needs only
      # curl/wget + tar and no package manager or root, so it works across all
      # of them. Pinning avoids the flaky release-manifest fetch entirely.
      # Quarto is required because the package ships .qmd vignettes, which
      # R CMD check needs to render.
      - name: Install Quarto (tarball)
        shell: bash
        run: |
          version=1.11.9
          url="https://github.com/quarto-dev/quarto-cli/releases/download/v${version}/quarto-${version}-linux-amd64.tar.gz"
          if command -v curl >/dev/null 2>&1; then
            curl -fsSL "$url" -o /tmp/quarto.tar.gz
          elif command -v wget >/dev/null 2>&1; then
            wget -q -O /tmp/quarto.tar.gz "$url"
          elif command -v python3 >/dev/null 2>&1; then
            python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1],'/tmp/quarto.tar.gz')" "$url"
          else
            echo "No curl, wget or python3 available to download Quarto" >&2
            exit 1
          fi
          mkdir -p /tmp/quarto
          tar -xzf /tmp/quarto.tar.gz -C /tmp/quarto --strip-components=1
          echo "/tmp/quarto/bin" >> "$GITHUB_PATH"
      # Install only hard dependencies (Depends/Imports/LinkingTo) plus the
      # packages needed to build vignettes and run tests, but NOT the full
      # Suggests set. fiber's only transitive-heavy Suggests is `dti`, whose
      # dependency tree pulls in quadprog and rgl: quadprog 1.5-8 fails to
      # build with the flang-new-22 toolchain on the clang21/clang22 containers,
      # and rgl leaks 8 bytes under valgrind when run headless (no X11 display,
      # it falls back to the rgl null device). dti interop is used only behind
      # requireNamespace("dti") guards, so checks/tests/vignettes degrade
      # gracefully when it is absent. knitr/quarto/tinytest are re-added via
      # extra-packages so .qmd vignettes still render and tinytest-based tests
      # still run; _R_CHECK_FORCE_SUGGESTS_ is disabled (job env) so the absent
      # dti does not surface as a check NOTE.
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
          extra-packages: 'any::rcmdcheck, any::knitr, any::quarto, any::tinytest'
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}
    # See the linux-containers job: dti (Suggests) is not installed on rhub, so
    # tell R CMD check not to fail on its absence. RHUB_ACTIONS_DEPS_DEPENDENCIES
    # selects the "hard" dependency set (see the linux-containers job comment).
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      RHUB_ACTIONS_DEPS_DEPENDENCIES: '"hard"'

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Pin a specific Quarto release (instead of the action default "release",
      # which fetches https://quarto.org/docs/download/_download.json on every
      # run). That manifest fetch is flaky on the containerized rhub platforms
      # (cURL write failures -> exit 127), so pinning a version skips it and
      # downloads a fixed release deterministically. Quarto is required because
      # the package ships .qmd vignettes.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      # Hard dependencies plus vignette/test-build packages only; see the
      # linux-containers job for why the Suggests set (which would drag in
      # dti -> quadprog/rgl) is not installed on rhub.
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
          extra-packages: 'any::rcmdcheck, any::knitr, any::quarto, any::tinytest'
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
